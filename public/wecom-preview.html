<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>企微客户预览 · Phone Cloud</title>
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/wecom-preview.css">
</head>
<body class="wecom-preview-page">
  <main class="wecom-preview-shell">
    <header><a href="/">← 返回平台</a><span>PHONE CLOUD</span></header>
    <section class="panel">
      <p class="eyebrow">企业微信</p><h1>客户添加预览</h1>
      <p class="hint">完成手机号搜索和备注核对，停在发送邀请前。不会发送添加申请；最多2台同时运行。</p>
      <form id="previewForm">
        <label>测试手机<select id="device" required><option value="">正在读取设备…</option></select></label>
        <label>企微应用<select id="appSlot" required><option value="">请选择手机</option></select></label>
        <label>客户手机号<input id="phone" type="tel" inputmode="numeric" autocomplete="off" pattern="1[3-9][0-9]{9}" maxlength="11" required placeholder="请输入授权测试号码"></label>
        <label>备注名（选填，最多20字）<input id="remarkName" type="text" maxlength="20" placeholder="留空使用：测试客户"></label>
        <label>描述（选填，最多120字）<textarea id="description" rows="3" maxlength="120" placeholder="留空使用：接口联调测试"></textarea></label>
        <p class="hint">仅补充空白备注和描述，已有内容保留。</p>
        <button id="submit" type="submit" disabled>运行至发送前</button>
      </form>
      <p id="feedback" role="status" aria-live="polite"></p>
    </section>
    <p><a href="/wecom-preview-api.md" target="_blank" rel="noopener noreferrer">接口说明</a></p>
    <section class="panel"><div class="wecom-history-heading"><h2>本账号的预览任务</h2><button id="refresh" class="ghost-button">刷新</button></div><div id="history"></div></section>
  </main>
  <script type="module" src="/wecom-preview.js?v=20261103-errors-rc1"></script>
</body></html>
