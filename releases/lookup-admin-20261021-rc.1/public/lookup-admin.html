<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>查名字 · 管理后台</title><link rel="stylesheet" href="/lookup-admin.css?v=20261021-rc1"></head><body><main>
<div class="top"><div><h1>查名字</h1><p class="sub">任务进度、手机账号和失败现场</p></div><div class="tools"><a href="/" target="_top">返回平台</a><a href="/lookup-pool.html" target="_top">调度设置</a><button id="refresh">刷新</button></div></div>
<p id="notice" role="status" aria-live="polite">正在读取…</p>
<div class="summary" id="summary"></div>
<section><div class="sectionhead"><h2>本轮占用的手机</h2><span class="hint" id="capacity"></span></div><div class="phones" id="phones"></div></section>
<section class="record inventory"><div class="sectionhead"><div><h2>全部手机与账号</h2><p id="inventoryHint" class="hint"></p></div></div><div class="tools"><input id="search" type="search" placeholder="手机编号 / 账号" aria-label="搜索手机或账号"><select id="filter" aria-label="筛选手机"><option value="all">全部手机</option><option value="enabled">已启用</option><option value="ready">探测通过</option><option value="human">需要人工</option><option value="blocked">暂不可分配</option></select><select id="accountFilter" aria-label="筛选账号"><option value="all">全部账号</option><option value="cooling">受限冷却</option><option value="login_required">账号掉线</option><option value="ready">探测通过</option><option value="unprobed">待探测</option></select></div><div class="tablewrap" tabindex="0" role="region" aria-label="手机账号列表"><table><thead><tr><th>手机 / 状态</th><th>账号 / 记录时间</th><th>账号状态</th><th>原因 / 恢复条件</th><th>最近失败</th></tr></thead><tbody id="accounts"></tbody></table></div><div class="pager"><span id="devicePage"></span><div><button id="prev">上一页</button> <button id="next">下一页</button></div></div></section>
<section class="record records"><div class="sectionhead"><div><h2>查询记录</h2><p class="hint">原查询合并展示，点开查看每次分配和恢复；不将异常当作无姓名。</p></div><div class="tools"><button id="latest">回到最新</button><button id="older">更早记录</button></div></div><div class="tablewrap"><table><thead><tr><th>提交时间</th><th>手机号</th><th>结果 / 状态</th><th>分配次数</th><th>查询过程</th></tr></thead><tbody id="requests"></tbody></table></div></section>
<p class="footer">每5秒只读刷新。账号列表来自最近已确认记录；未探测的账号不代表可查。页面不会操作手机。</p>
</main><dialog id="detail" aria-labelledby="detailTitle"><div class="sectionhead"><h2 id="detailTitle">查询过程</h2><button id="close" aria-label="关闭详情">×</button></div><div id="detailBody"></div></dialog><dialog id="evidence" aria-labelledby="evidenceTitle"><div class="sectionhead"><h2 id="evidenceTitle">当次截图</h2><button id="closeEvidence" aria-label="关闭截图">×</button></div><div id="evidenceBody"></div></dialog><script type="module" src="/lookup-admin.js?v=20261021-rc1"></script></body></html>
