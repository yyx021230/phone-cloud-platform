plugins {
    id "com.android.application"
}

android {
    namespace "com.ztqc.smsrelay"
    compileSdk 35

    defaultConfig {
        applicationId "com.ztqc.smsrelay"
        minSdk 23
        targetSdk 35
        versionCode 109
        versionName "0.4.0-fleet-compat"
    }

    buildTypes {
        // Same bytecode and manifest contract as the production debug build,
        // but isolated from the Agent's exact-package collection boundary.
        // It can be installed fleet-wide for runtime compatibility checks
        // without taking over SMS delivery or talking to production services.
        compatProbe {
            initWith debug
            applicationIdSuffix ".compatprobe"
            versionNameSuffix "-probe"
            debuggable true
        }
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
