services:
  postgres:
    image: postgres:16-alpine
    container_name: phone-cloud-postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_DB: phone_cloud
      POSTGRES_USER: phone_cloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phone_cloud -d phone_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: phone-cloud-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  phone-cloud:
    build: .
    container_name: phone-cloud-platform
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /app/data
      STORAGE_BACKEND: ${STORAGE_BACKEND:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgres://phone_cloud:${POSTGRES_PASSWORD}@postgres:5432/phone_cloud}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVIDENCE_DIR: ${EVIDENCE_DIR:-evidence}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  postgres-data:
  redis-data:
