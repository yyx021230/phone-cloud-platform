<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>查名字 · 管理后台设计稿</title>
<style>
:root{color-scheme:dark;--bg:#0b0f14;--panel:#121923;--line:#29333e;--text:#e7edf3;--muted:#92a1af;--amber:#ffc247;--green:#72d4ac}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Avenir Next","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:4px}button:disabled{opacity:.45;cursor:not-allowed}button,input,select{border:1px solid var(--line);border-radius:6px;background:#18212b;padding:8px 12px}h1,h2,h3,p{margin:0}h1{font-size:25px;font-weight:600}h2{font-size:17px;font-weight:600}h3{font-size:15px}small,.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:100vh}.sidebar{padding:28px 18px;background:#10171f;border-right:1px solid var(--line)}.brand{font-size:17px;font-weight:600;margin-bottom:40px}.brand b{color:var(--amber);border:1px solid var(--amber);padding:5px;margin-right:8px}.nav{padding:11px 12px;color:var(--muted);margin:4px 0}.nav.active{color:var(--amber);background:#30291b;border-left:3px solid var(--amber)}main{padding:30px 34px;max-width:1500px;width:100%;margin:auto;min-width:0}.top,.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:14px}.top{margin-bottom:24px}.sub{color:var(--muted);font-size:12px;margin-top:5px}.preview{font-size:12px;color:var(--amber);padding:5px 10px;border:1px solid #5a4a29;border-radius:4px;white-space:nowrap}.summary{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--panel);border-radius:8px;margin-bottom:30px}.stat{padding:18px 24px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:32px;line-height:1.5;font-weight:500;font-variant-numeric:tabular-nums}.green{color:var(--green)}.amber{color:var(--amber)}.sectionhead{margin-bottom:15px}.filters{display:flex;gap:6px}.filters button{font-size:12px;border-color:transparent;background:transparent;color:var(--muted);padding:5px 10px}.filters button[aria-pressed=true]{background:#26313c;color:var(--text)}.phones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:30px}.phone{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:8px;text-align:left;min-height:165px}.phone:hover{border-color:#65788b}.phone.human{border-color:#6b5430;background:#1d1c18}.phone .number{font-size:24px;font-weight:500;margin-bottom:16px}.phone .number small{font-size:12px;margin-left:4px}.state{font-size:13px;display:flex;align-items:center;gap:7px}.dot{width:6px;height:6px;background:currentColor;border-radius:50%;flex-shrink:0}.phone .next{color:var(--muted);font-size:11px;margin-top:8px}.record{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:20px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{width:220px;font-size:12px}.tools select{font-size:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-weight:400;color:var(--muted);font-size:12px;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:14px 10px;border-bottom:1px solid #212b35;white-space:nowrap}tbody tr:last-child td{border-bottom:0}.link{border:0;background:none;color:#a5c8ef;padding:0;font-size:12px}.empty{padding:28px;text-align:center;color:var(--muted)}.bottom{display:flex;justify-content:space-between;gap:10px;margin-top:20px;color:var(--muted);font-size:12px}.bottom button{font-size:12px}.dotlabel{display:inline-flex;align-items:center;gap:7px}dialog{width:min(560px,94vw);max-height:85vh;background:#121923;color:var(--text);border:1px solid #3b4958;border-radius:10px;padding:24px}dialog::backdrop{background:#000a}.close{padding:3px 9px;font-size:18px;background:transparent;border:0}.detailrow{display:flex;justify-content:space-between;gap:24px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.detailrow span{color:var(--muted)}.detailrow b{text-align:right;font-weight:500}.message{background:#22241f;border-left:2px solid var(--amber);padding:12px 14px;margin:18px 0;font-size:13px}.timeline{list-style:none;margin:20px 0 0;padding:0}.timeline li{border-left:1px solid #40505f;padding:0 0 18px 18px;position:relative;margin-left:4px;font-size:13px}.timeline li:before{content:'';position:absolute;left:-4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--amber)}.timeline small{display:block}.timeline li:last-child{padding-bottom:0}details{margin-top:22px;border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted)}summary{cursor:pointer}.technical{padding-top:12px;line-height:1.9;overflow-wrap:anywhere}.footer{font-size:11px;color:#70808f;margin-top:22px}.phoneempty{grid-column:1/-1}.dialog-note{font-size:11px;color:var(--muted);margin-top:15px}
@media(max-width:1100px){.layout{grid-template-columns:160px minmax(0,1fr)}main{padding:24px}.phones{grid-template-columns:repeat(3,minmax(0,1fr))}.sectionhead{flex-wrap:wrap}}
@media(max-width:740px){.layout{display:block}.sidebar{display:none}main{padding:18px}.summary{grid-template-columns:repeat(2,1fr)}.stat{border-bottom:1px solid var(--line);padding:14px 18px}.phones{grid-template-columns:repeat(2,minmax(0,1fr))}.phone{padding:15px}.record{padding:14px}.tools input{width:100%;min-width:0}.tools{width:100%}.top{align-items:flex-start}.top .preview{font-size:10px}.bottom{align-items:center}.filters{flex-wrap:wrap}}

.inventory{margin-bottom:30px}.inventory .tools{margin:16px 0}.inventory-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.inventory-summary button{font-size:12px;color:var(--muted);background:transparent}.inventory-summary button[aria-pressed=true]{color:var(--amber);border-color:#75603a;background:#252218}.red{color:#ee9898}.smallline{font-size:11px;color:var(--muted);display:block;margin-top:3px}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:var(--muted);gap:10px}.pager button{font-size:12px;padding:4px 10px}.accountbox{border:1px solid var(--line);border-radius:6px;padding:13px 15px;margin-top:12px}.accounthead{display:flex;justify-content:space-between;gap:12px;font-size:13px}.accountbox p{font-size:12px;color:var(--muted);margin:8px 0}.accountbox .meta{font-size:11px;color:var(--muted)}.accountbox .link{margin-top:10px}.capture-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;margin-top:18px}.capture-placeholder{min-height:330px;border:1px dashed #596777;border-radius:9px;background:#0c121a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:20px;gap:16px}.capture-placeholder svg{width:42px;height:42px;opacity:.7}.capture-placeholder b{font-size:13px;color:var(--text)}.capture-placeholder p{font-size:12px}.capture-meta .detailrow{display:block;padding:8px 0}.capture-meta .detailrow b{display:block;text-align:left;overflow-wrap:anywhere;margin-top:2px}.account-dialog{width:min(650px,94vw)}#evidence{width:min(720px,94vw)}.muted-note{font-size:12px;color:var(--muted);margin-top:8px}.mini-pill{font-size:10px;border:1px solid #3f4d58;border-radius:3px;padding:2px 5px;color:var(--muted);margin-left:7px}.failure-actions{display:flex;gap:12px}
@media(max-width:740px){.capture-layout{grid-template-columns:1fr}.capture-placeholder{min-height:220px}.inventory-summary{gap:6px}.pager{flex-wrap:wrap}.accounthead{flex-wrap:wrap}}

.inventory .tablewrap{max-height:520px;scrollbar-gutter:stable;border-top:1px solid var(--line)}
.inventory th{position:sticky;top:0;background:#18212b;z-index:1}
.inventory .tablewrap:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.tools .reset{font-size:12px;background:transparent;color:var(--muted)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar"><div class="brand"><b>PC</b>云管理后台</div><nav aria-label="后台导航"><div class="nav">总览</div><div class="nav">用户账号</div><div class="nav">手机设备</div><div class="nav">短信接收</div><div class="nav">小红书</div><div class="nav active">查名字</div><div class="nav">系统设置</div></nav></aside>
<main>
<header class="top"><div><h1>查名字</h1><p class="sub"><span class="dotlabel green"><i class="dot"></i>本轮运行中</span>　·　14:10 启动</p></div><span class="preview">设计稿 · 演示数据</span></header>
<section class="summary" aria-label="本轮概况"><div class="stat"><span>正在查</span><strong class="green">2<small style="font-size:14px"> / 5台</small></strong></div><div class="stat"><span>排队中</span><strong>18<small style="font-size:14px"> 条</small></strong></div><div class="stat"><span>需要人工</span><strong class="amber">2<small style="font-size:14px"> 台</small></strong></div><div class="stat"><span>已完成</span><strong>45<small style="font-size:14px"> 条</small></strong></div></section>
<section aria-labelledby="phonesTitle"><div class="sectionhead"><h2 id="phonesTitle">本轮手机</h2><div class="filters" aria-label="手机筛选"><button data-filter="all" aria-pressed="true">全部 5</button><button data-filter="human" aria-pressed="false">需要人工 2</button></div></div><div class="phones" id="phones"></div></section>
<section class="record inventory" aria-labelledby="inventoryTitle">
<div class="sectionhead"><div><h2 id="inventoryTitle">全部手机与账号</h2><p class="muted-note">名单48台 · 148号尚未入库</p></div><span class="preview">账号与状态均为演示</span></div>
<div class="inventory-summary" id="inventoryFilters" aria-label="全部手机状态筛选"></div>
<div class="tools"><input type="search" id="inventorySearch" aria-label="搜索手机或账号" placeholder="手机编号 / 账号"><select id="accountStatus" aria-label="筛选账号状态"><option>全部账号状态</option><option>可查</option><option>受限冷却</option><option>需登录</option><option>待拼图</option><option>识别异常</option><option>待确认</option><option>待探测</option><option>状态未知</option></select><button class="reset" id="resetInventory" hidden>清除筛选</button><span class="muted-note">表内滚动查看更多账号</span></div>
<div class="tablewrap" tabindex="0" role="region" aria-label="手机账号列表，可滚动查看更多"><table><thead><tr><th scope="col">手机</th><th scope="col">账号</th><th>账号状态</th><th>原因</th><th>什么时候恢复</th><th>失败截图</th><th></th></tr></thead><tbody id="inventoryRows"></tbody></table></div>
<div class="pager"><span id="inventoryPage"></span><div><button id="prevDevices">上一页</button> <button id="nextDevices">下一页</button></div></div>
</section>
<section class="record" aria-labelledby="recordsTitle"><div class="sectionhead"><h2 id="recordsTitle">查询记录</h2><div class="tools"><input id="search" type="search" aria-label="搜索号码或查询编号" placeholder="搜索号码 / 查询编号"><select id="status" aria-label="查询状态"><option value="全部">全部状态</option><option>排队中</option><option>查询中</option><option>有姓名</option><option>无姓名</option><option>查询失败</option></select></div></div><div class="tablewrap"><table><thead><tr><th>时间</th><th>手机号</th><th>状态</th><th>手机</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div class="bottom"><span>最多5台同时处理</span><button disabled title="设计稿不操作真实任务">结束本轮</button></div>
<p class="footer">本地设计预览，不连接线上。点击手机或“查看过程”查看详情。</p>
</main></div>
<dialog class="account-dialog" id="detail" aria-labelledby="detailTitle"><div class="sectionhead"><h2 id="detailTitle"></h2><button class="close" id="close" aria-label="关闭详情">×</button></div><div id="detailBody"></div><p class="dialog-note">演示内容，不代表手机当前状态。</p></dialog>
<dialog id="evidence" aria-labelledby="evidenceTitle"><div class="sectionhead"><h2 id="evidenceTitle">失败截图</h2><button class="close" id="closeEvidence" aria-label="关闭截图">×</button></div><div id="evidenceBody"></div></dialog>
<script>
const $=s=>document.querySelector(s);
const phones=[
 {id:'112',status:'正在查询',next:'正在读取姓名',tone:'green',account:'138******01',hint:'查询完成后，自动接下一条。',steps:['14:12　探测通过','15:10　收到号码','15:10　正在读取结果']},
 {id:'163',status:'正在查询',next:'正在搜索号码',tone:'green',account:'139******02',hint:'查询完成后，自动接下一条。',steps:['14:14　探测通过','15:10　收到号码','15:10　正在搜索']},
 {id:'162',status:'需要拼图',next:'请完成拼图',tone:'amber',human:true,account:'137******03',hint:'完成拼图并退出控屏后，系统自动检查接续。',steps:['15:08　发现拼图','15:08　提醒已发送','当前　等待完成拼图']},
 {id:'172',status:'正在切号',next:'当前账号已达上限',tone:'amber',account:'136******04',hint:'原号码已交给112号，当前手机正在换账号。',steps:['15:07　账号达到上限','15:07　冷却已记录，原号码转交112号','当前　切换账号，完成后重新探测']},
 {id:'53',status:'需要拼图',next:'请完成拼图',tone:'amber',human:true,account:'135******05',hint:'完成拼图并退出控屏后，系统自动检查接续。',steps:['15:09　准备查询','15:09　提醒已发送','当前　等待完成拼图']}
];
const records=[
 {id:'014',time:'15:10:02',phone:'139****0014',status:'查询失败',device:'155号',evidence:'e155',steps:['15:09:21　分配给155号','15:09:42　页面无法识别','15:10:02　恢复未成功，记录失败'],note:'没有取得可靠结果，不代表这个号码无姓名。'},
 {id:'019',time:'15:10:22',phone:'139****0019',status:'排队中',device:'—',steps:['15:08:21　收到号码','15:10:22　对方重提，仍用原查询','当前　等待空闲手机'],note:'重提没有新增查询。'},
 {id:'018',time:'15:10:18',phone:'139****0018',status:'查询中',device:'163号',steps:['15:10:18　收到号码','15:10:19　分配给163号','当前　正在查询'],note:'其他号码继续处理，不会等这一条。'},
 {id:'017',time:'15:09:56',phone:'139****0017',status:'查询中',device:'112号',steps:['15:07:02　分配给172号','15:07:20　账号触限，记录冷却','15:07:21　旧尝试已安全结束','15:09:56　原查询交给112号'],note:'原查询保留，不需要重新提交。'},
 {id:'016',time:'15:09:40',phone:'139****0016',status:'有姓名',device:'163号',steps:['15:09:10　收到号码','15:09:12　分配给163号','15:09:40　查到姓名，结果已保存'],note:'结果：张*（演示）。'},
 {id:'015',time:'15:09:32',phone:'139****0015',status:'无姓名',device:'112号',steps:['15:09:02　收到号码','15:09:04　分配给112号','15:09:32　确认无姓名，结果已保存'],note:'对外返回空字符串。'}
];
function renderPhones(filter='all'){$('#phones').innerHTML=phones.filter(p=>filter==='all'||p.human).map(p=>`<button class="phone ${p.human?'human':''}" data-phone="${p.id}"><div class="number">${p.id}<small>号</small></div><div class="state ${p.tone}"><i class="dot"></i>${p.status}</div><p class="next">${p.next}</p></button>`).join('');}
function renderRecords(){const q=$('#search').value.trim().toLowerCase(),status=$('#status').value;$('#rows').innerHTML=[...records].sort((a,b)=>b.time.localeCompare(a.time)).filter(r=>(status==='全部'||r.status===status)&&(!q||(`demo-${r.id} ${r.phone}`).includes(q))).map(r=>`<tr><td class="muted">${r.time}</td><td>${r.phone}</td><td class="${['有姓名','无姓名'].includes(r.status)?'green':r.status==='查询失败'?'red':''}">${r.status}</td><td>${r.device}</td><td><div class="failure-actions"><button class="link" data-record="${r.id}">查看过程</button>${r.evidence?`<button class="link" data-evidence="${r.evidence}">查看截图</button>`:""}</div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">没有找到记录</td></tr>';}
function timeline(steps){return '<ol class="timeline">'+steps.map(s=>`<li>${s}</li>`).join('')+'</ol>';}
function show(title,body){$('#detailTitle').textContent=title;$('#detailBody').innerHTML=body;$('#detail').showModal();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.filter){document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderPhones(b.dataset.filter);}if(b.dataset.phone){showInventory(b.dataset.phone);}if(b.dataset.record){const r=records.find(x=>x.id===b.dataset.record);show(r.phone,`<div class="detailrow"><span>状态</span><b>${r.status}</b></div><p class="message">${r.note}</p>${timeline(r.steps)}${r.evidence?`<p style="margin-top:16px"><button class="link" data-evidence="${r.evidence}">查看这次失败截图 →</button></p>`:''}<details><summary>更多信息</summary><div class="technical">查询编号：DEMO-${r.id}<br>轮次：ROUND-DEMO<br>手机：${r.device}<br>重提记录、内部尝试、错误与通知明细在正式版展开。</div></details>`);}});
$('#close').onclick=()=>$('#detail').close();$('#search').oninput=renderRecords;$('#status').onchange=renderRecords;renderPhones();renderRecords();

// 全名单采用已提供的49台编号；148未入库。以下账号与状态是设计样例。
const poolNumbers=[51,52,54,55,87,138,152,188,172,156,155,115,60,58,164,163,154,6,57,10,183,82,86,121,146,149,153,181,182,162,161,142,74,78,79,118,130,157,147,101,107,165,112,67,53,128,158,143];
const account=(label,state,reason,recovery,extra={})=>({label,state,reason,recovery,...extra});
const accountExamples={
 '112':{state:'可查',group:'ready',reason:'本轮探测已通过',time:'15:10:24',accounts:[account('138******01','可查','当前账号探测通过','正在处理号码',{current:true}),account('138******11','待探测','已保存，尚未测试','切换后探测')]},
 '163':{state:'可查',group:'ready',reason:'本轮探测已通过',time:'15:10:22',accounts:[account('139******02','可查','当前账号探测通过','正在处理号码',{current:true})]},
 '162':{state:'待拼图',group:'blocked',reason:'当前账号需人工验证',time:'15:08:20',accounts:[account('137******03','待拼图','当前页面出现拼图','完成后自动检查',{current:true}),account('137******13','待探测','已保存，尚未测试','切换后探测')]},
 '172':{state:'切号中',group:'blocked',reason:'当前账号受限，正在换号',time:'15:07:21',evidence:'e172',accounts:[account('136******04','受限冷却','查询达到上限','23:07到期，再探测',{last:true,evidence:'e172'}),account('136******14','待探测','切换中的目标账号','确认身份后探测')]},
 '53':{state:'待拼图',group:'blocked',reason:'当前账号需人工验证',time:'15:09:30',accounts:[account('135******05','待拼图','当前页面出现拼图','完成后自动检查',{current:true})]},
 '118':{state:'账号掉线',group:'blocked',reason:'本轮不再分配',time:'15:06:10',evidence:'e118',accounts:[account('135******18','需登录','登录已失效','人工登录后，下轮探测',{last:true,evidence:'e118'}),account('135******28','待确认','没有新鲜身份信息','下轮重新确认')]},
 '161':{state:'全部冷却',group:'blocked',reason:'2个已知账号均受限',time:'15:04:00',evidence:'e161',accounts:[account('135******61','受限冷却','查询达到上限','22:56到期，再探测',{last:true,evidence:'e161'}),account('135******71','受限冷却','查询达到上限','23:04到期，再探测',{evidence:'missing'})]},
 '155':{state:'查询异常',group:'blocked',reason:'结果页面无法识别',time:'15:10:02',evidence:'e155',accounts:[account('135******55','识别异常','没有读到可靠结果','需兼容页面后复核',{current:true,evidence:'e155'})]},
 '130':{state:'手机离线',group:'blocked',reason:'当前连接不可用',time:'15:05:03',accounts:[account('135******30','状态未知','手机离线，无法确认','恢复在线后探测',{last:true})]}
};
const inventory=poolNumbers.map(id=>({id:String(id),...(accountExamples[id]||{state:'待确认',group:'unknown',reason:'尚未读取账号状态',time:'—',accounts:[]})})).sort((a,b)=>{const order=['112','163','162','172','53','118','161','155','130'];const ai=order.indexOf(a.id),bi=order.indexOf(b.id);return (ai<0?1000+Number(a.id):ai)-(bi<0?1000+Number(b.id):bi);});
const evidenceExamples={
 e155:{phone:'155',account:'135******55',time:'2026-10-21 15:10:02',reason:'查询结果页面无法识别',query:'DEMO-014 / 第1次尝试'},
 e172:{phone:'172',account:'136******04',time:'2026-10-21 15:07:20',reason:'当前账号达到查询上限',query:'DEMO-017 / 第1次尝试'},
 e118:{phone:'118',account:'135******18',time:'2026-10-21 15:06:10',reason:'切号后停在登录页面',query:'启动探测 / 第1次尝试'},
 e161:{phone:'161',account:'135******61',time:'2026-10-21 14:56:00',reason:'当前账号达到查询上限',query:'启动探测 / 第1次尝试'}
};
let inventoryFilter='all',inventoryPage=0;
const stateTone=s=>s==='可查'?'green':['查询异常','账号掉线','识别异常','需登录'].includes(s)?'red':['待确认','状态未知','待探测'].includes(s)?'muted':'amber';
function renderInventory(){
 const options=[['all','全部手机'],['ready','可查'],['blocked','暂不能查'],['unknown','待确认']];
 $('#inventoryFilters').innerHTML=options.map(([key,label])=>`<button data-inventory-filter="${key}" aria-pressed="${key===inventoryFilter}">${label} ${inventory.filter(d=>key==='all'||d.group===key).length}</button>`).join('');
 const q=$('#inventorySearch').value.trim(),af=$('#accountStatus').value;const matchingAccounts=d=>(d.accounts.length?d.accounts:[{label:'未读取',state:'状态未知',reason:'账号列表尚未读取',recovery:'读取后确认'}]).filter(a=>(af==='全部账号状态'||a.state===af)&&(!q||d.id.includes(q)||a.label.includes(q)));const selected=inventory.filter(d=>(inventoryFilter==='all'||d.group===inventoryFilter)&&matchingAccounts(d).length);
 $('#resetInventory').hidden=inventoryFilter==='all'&&!q&&af==='全部账号状态';
 const pages=Math.max(1,Math.ceil(selected.length/8));inventoryPage=Math.min(inventoryPage,pages-1);
 const page=selected.slice(inventoryPage*8,inventoryPage*8+8);
 $('#inventoryRows').innerHTML=page.map(d=>{const entries=matchingAccounts(d);return entries.map((a,i)=>`<tr>${i===0?`<td rowspan="${entries.length}"><b>${d.id}号</b><span class="smallline ${stateTone(d.state)}">${d.state}</span></td>`:''}<td>${a.label}<span class="smallline">${a.current?'当前账号':a.last?'上次确认':d.accounts.length?'已保存':'账号数量未知'}</span></td><td class="${stateTone(a.state)}">${a.state}</td><td>${a.reason}<span class="smallline">更新 ${d.time}</span></td><td>${a.recovery}</td><td>${a.evidence&&a.evidence!=='missing'?`<button class="link" data-evidence="${a.evidence}">查看截图</button>`:a.evidence==='missing'?'<span class="muted">未留存</span>':'<span class="muted">—</span>'}</td><td><button class="link" data-inventory="${d.id}">详情</button></td></tr>`).join('');}).join('')||'<tr><td colspan="7" class="empty">没有找到手机或账号</td></tr>';
 const knownCount=selected.reduce((n,d)=>n+(d.accounts.length?matchingAccounts(d).length:0),0),unknownCount=selected.filter(d=>!d.accounts.length).length;
 $('#inventoryPage').textContent=`${selected.length}台 · ${knownCount}个已知账号${unknownCount?' · '+unknownCount+'台未读取':''} · 第${inventoryPage+1}/${pages}页`;
 $('#prevDevices').disabled=inventoryPage===0;$('#nextDevices').disabled=inventoryPage>=pages-1;
}
function showInventory(id){const d=inventory.find(d=>d.id===id);if(!d)return;
 const p=phones.find(p=>p.id===id);
 show(id+'号 · 全部账号',`<div class="detailrow"><span>手机状态</span><b class="${stateTone(d.state)}">${d.state}</b></div><p class="message">${d.reason}</p>${d.accounts.length?d.accounts.map(a=>`<article class="accountbox"><div class="accounthead"><b>${a.label}<span class="mini-pill">${a.current?'当前账号':a.last?'上次确认':'已保存'}</span></b><b class="${stateTone(a.state)}">${a.state}</b></div><p>${a.reason}</p><div class="meta">恢复：${a.recovery}</div>${a.evidence&&a.evidence!=='missing'?`<button class="link" data-evidence="${a.evidence}">查看该账号截图 →</button>`:a.evidence==='missing'?'<p>未留存截图 · 无法回看当时画面</p>':''}</article>`).join(''):'<p class="empty">尚未读取账号，不代表没有账号。<br>正式版展示最近一次有效的账号列表。</p>'}${p?`<details><summary>最近过程</summary>${timeline(p.steps)}</details>`:''}<p class="dialog-note">示例更新：${d.time}。冷却到期仍需探测；历史账号不代表当前登录账号。</p>`);
}
function showEvidence(id){const e=evidenceExamples[id];if(!e)return;$('#evidenceTitle').textContent=e.phone+'号 · 失败截图';$('#evidenceBody').innerHTML=`<p class="muted-note">查看失败当时的画面，不打开实时控屏。</p><div class="capture-layout"><div class="capture-placeholder"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="7" y="6" width="34" height="36" rx="3"/><circle cx="18" cy="17" r="3"/><path d="m8 35 11-12 9 9 6-6 7 8"/></svg><b>失败时截图</b><p>这里只展示图片位置<br>设计稿未接入真实截图</p></div><div class="capture-meta"><div class="detailrow"><span>手机 / 账号</span><b>${e.phone}号 · ${e.account}</b></div><div class="detailrow"><span>失败原因</span><b>${e.reason}</b></div><div class="detailrow"><span>截图时间（演示）</span><b>${e.time}</b></div><div class="detailrow"><span>对应任务</span><b>${e.query}</b></div><p class="muted-note">正式版可放大原图。未采集或已过期时明确标注，不用其他时刻的图片代替。</p></div></div>`;$('#evidence').showModal();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.inventoryFilter){inventoryFilter=b.dataset.inventoryFilter;inventoryPage=0;renderInventory();document.querySelector(`[data-inventory-filter="${inventoryFilter}"]`).focus();}if(b.dataset.inventory)showInventory(b.dataset.inventory);if(b.dataset.evidence)showEvidence(b.dataset.evidence);});
$('#resetInventory').onclick=()=>{inventoryFilter='all';inventoryPage=0;$('#inventorySearch').value='';$('#accountStatus').value='全部账号状态';renderInventory();$('#inventorySearch').focus();};
$('#accountStatus').onchange=()=>{inventoryPage=0;renderInventory();};$('#closeEvidence').onclick=()=>$('#evidence').close();$('#inventorySearch').oninput=()=>{inventoryPage=0;renderInventory();};$('#prevDevices').onclick=()=>{inventoryPage--;renderInventory();};$('#nextDevices').onclick=()=>{inventoryPage++;renderInventory();};renderInventory();
</script>
</body></html>
